# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md and the docs/web/ site render from tera.templates/, loading
# config/*.lua with load_lua (the pyanyzip pattern; lua because version_str()
# reads a lowercase `tup` global and pylint would reject lowercase module
# constants). The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
]
